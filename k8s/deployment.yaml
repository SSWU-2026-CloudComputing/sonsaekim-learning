apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learning-service
  template:
    metadata:
      labels:
        app: learning-service
    spec:
      containers:
        - name: learning-service
          image: docker.io/mminnn28/sonsaekim-learning:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: learning-config

            - secretRef:
                name: learning-secret